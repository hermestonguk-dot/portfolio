[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-music-recommender"
version = "0.1.0"
description = "LightGCN music recommendation with popularity-aware reranking"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
