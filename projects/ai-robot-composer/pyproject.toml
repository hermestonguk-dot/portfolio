[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-robot-composer"
version = "0.1.0"
description = "Emotion-conditioned MIDI generation with a hierarchical variational autoencoder."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "music21>=9.1",
  "numpy>=1.24",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
robot-composer = "robot_composer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

